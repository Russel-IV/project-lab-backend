spring.application.name=chatbot-service

# Database configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=system
spring.datasource.password=oracle_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring AI OpenAI configuration
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Spring AI Vector Store (Oracle)
spring.ai.vectorstore.oracle.initialize-schema=true
spring.ai.vectorstore.oracle.table-name=SPRING_AI_VECTORS
spring.ai.vectorstore.oracle.distance-type=COSINE

# Server & Backend Integration
server.port=8086
frui.backend.graphql.url=${GATEWAY_GRAPHQL_URL:http://project-lab-backend:8080/graphql}

# Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
