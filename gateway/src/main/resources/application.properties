# =========================================================================
# Spring Boot Application Properties
# =========================================================================

spring.application.name=gateway

# ----------------------------------------------------
# SERVICE DISCOVERY (docs/adr/0006)
# ----------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# ----------------------------------------------------
# DATABASE CONFIGURATION (PostgreSQL)
# ----------------------------------------------------
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mi_base_datos}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password_local}

# ----------------------------------------------------
# FLYWAY CONFIGURATION
# ----------------------------------------------------
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6

# ----------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# ----------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none

# ----------------------------------------------------
# GRAPHQL CONFIGURATION
# ----------------------------------------------------
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:false}
spring.graphql.schema.locations=classpath:graphql/,classpath:graphql/types/,classpath:graphql/inputs/
spring.graphql.schema.printer.enabled=${SCHEMA_PRINTER_ENABLED:false}

# File uploads — media-service (docs/adr/0003) writes into this same shared uploads
# volume; app.upload.dir here is only for the static /uploads/** handler in WebConfig.
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT (docs/adr/0009) — Identity issues tokens via app.jwt.secret (JwtService); the
# Gateway (and, later, every other service) validates them locally via a NimbusJwtDecoder
# bean in SecurityConfig, pointed at the same secret. See SecurityConfig.jwtDecoder() for
# why this is a manual bean rather than the spring.security.oauth2.resourceserver.jwt.*
# auto-configuration properties.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ----------------------------------------------------
# ACTUATOR
# ----------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=project-lab-backend

# ----------------------------------------------------
# LOGGING
# ----------------------------------------------------
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} [%X{correlationId}] - %msg%n
logging.level.root=INFO
logging.level.com.team1=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO
