spring.graphql.schema.printer.enabled=true

app.jwt.secret=${JWT_SECRET:dev-secret-key-please-change-in-production-must-be-at-least-256-bits}

app.cors.allowed-origins=*

# Logging overrides for dev
logging.level.com.team1=DEBUG
logging.level.org.springframework.web=DEBUG
