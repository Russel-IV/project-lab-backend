spring.application.name=booking-service
server.port=8083

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Own database (docs/adr/0011) — a separate Postgres container, not a schema inside
# the Gateway's database.
spring.datasource.url=jdbc:postgresql://${BOOKING_DB_HOST:localhost}:${BOOKING_DB_PORT:5437}/${BOOKING_DB_NAME:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${BOOKING_DB_USER:postgres}
spring.datasource.password=${BOOKING_DB_PASSWORD:password_local}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Room existence/price/capacity at booking-creation time (docs/adr/0002, docs/adr/0010)
# — a plain Feign call, deliberately NOT Resilience4j-wrapped with a fallback: unlike
# inventory-service's availability search (which can safely degrade to "show all" on a
# dependency outage), createBooking cannot proceed at all without real room data, so a
# dead inventory-service should fail the request loudly rather than fall back to
# fabricated data.
feign.client.config.inventory-service.connectTimeout=2000
feign.client.config.inventory-service.readTimeout=2000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
server.error.include-message=always

# Distributed tracing (docs/adr/0013)
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} [%X{traceId}] - %msg%n
