spring.application.name=review-service
server.port=8084

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Own database (docs/adr/0011) — a separate Postgres container, not a schema inside
# the Gateway's database.
spring.datasource.url=jdbc:postgresql://${REVIEW_DB_HOST:localhost}:${REVIEW_DB_PORT:5433}/${REVIEW_DB_NAME:review}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${REVIEW_DB_USER:postgres}
spring.datasource.password=${REVIEW_DB_PASSWORD:password_local}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
server.error.include-message=always

# Distributed tracing (docs/adr/0013)
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} [%X{traceId}] - %msg%n
