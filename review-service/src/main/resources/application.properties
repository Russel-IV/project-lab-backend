spring.application.name=review-service
server.port=8084

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Own database (docs/adr/0011) — a separate Postgres container, not a schema inside
# the Gateway's database.
spring.datasource.url=jdbc:postgresql://${REVIEW_DB_HOST:localhost}:${REVIEW_DB_PORT:5433}/${REVIEW_DB_NAME:review}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${REVIEW_DB_USER:postgres}
spring.datasource.password=${REVIEW_DB_PASSWORD:password_local}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
server.error.include-message=always
