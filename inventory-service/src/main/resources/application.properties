spring.application.name=inventory-service
server.port=8082

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Own database (docs/adr/0011) — a separate Postgres/PostGIS container, not a schema
# inside the Gateway's database. PostGIS is needed here (unlike identity/review/media):
# Stay.location is a GEOGRAPHY(POINT, 4326) column.
spring.datasource.url=jdbc:postgresql://${INVENTORY_DB_HOST:localhost}:${INVENTORY_DB_PORT:5436}/${INVENTORY_DB_NAME:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${INVENTORY_DB_USER:postgres}
spring.datasource.password=${INVENTORY_DB_PASSWORD:password_local}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Booking's conflict-check endpoint (docs/adr/0010), now the real booking-service
# (Phase 6). Kept short and explicit (StayService.buildSpec/RoomService.getAvailableRooms
# wrap this client in a Resilience4j CircuitBreaker with a skip-the-filter fallback) so
# a slow/dead dependency degrades search quickly instead of hanging a request.
feign.client.config.booking-service.connectTimeout=2000
feign.client.config.booking-service.readTimeout=2000

# BookingAvailabilityClient's circuit breaker (docs/adr/0010) — opens after a third of
# calls in a 10-call window fail, so a genuinely dead booking-service stops adding a
# 2s Feign timeout to every search almost immediately, instead of on every request.
resilience4j.circuitbreaker.instances.bookingConflictCheck.sliding-window-size=10
resilience4j.circuitbreaker.instances.bookingConflictCheck.failure-rate-threshold=33.33
resilience4j.circuitbreaker.instances.bookingConflictCheck.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bookingConflictCheck.permitted-number-of-calls-in-half-open-state=3

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
server.error.include-message=always
