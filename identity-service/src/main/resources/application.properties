spring.application.name=identity-service
server.port=8081

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:postgresql://${IDENTITY_DB_HOST:localhost}:${IDENTITY_DB_PORT:5435}/${IDENTITY_DB_NAME:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${IDENTITY_DB_USER:postgres}
spring.datasource.password=${IDENTITY_DB_PASSWORD:password_local}

spring.jpa.hibernate.ddl-auto=none

# Same secret the Gateway's NimbusJwtDecoder validates against (see JwtService kdoc).
# The fallback matches Gateway's application-dev.properties fallback exactly — .env
# doesn't set JWT_SECRET in this lab environment, and unlike Gateway this service
# doesn't run with SPRING_PROFILES_ACTIVE=dev, so the default has to live here
# directly rather than in a dev-profile-only override.
app.jwt.secret=${JWT_SECRET:dev-secret-key-please-change-in-production-must-be-at-least-256-bits}
app.jwt.expiry-ms=86400000

server.error.include-message=always
