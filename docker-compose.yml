# =========================================================================
# Docker Compose Configuration for Separated Spring Boot Backend
# =========================================================================
#
# To start the service, run:
#   docker compose up --build
# =========================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-lab-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
