# Per-container `mem_limit` budget (docs/adr/0017) — this box has 7.4GB total,
# smaller than docker-compose.prod.yml's 12GB, and unlike that file this one had
# NO memory governance at all: with no cgroup limit, each JVM's default heap
# sizing is computed against the FULL HOST memory rather than a container
# budget, so 7 concurrent JVMs had no ceiling stopping their combined growth
# from exceeding physical RAM + swap. That's what caused a real WSL2 VM OOM
# (severe enough to kill systemd itself, not just a container) during otherwise
# idle operation — see ADR-0017.
#   6x Postgres containers  @ 200m = 1200m
#   1x Zipkin                @ 300m =  300m
#   1x Gateway JVM            @ 900m (heaviest: GraphQL + JPA + Feign + Resilience4j)
#   6x domain-service/Eureka JVMs @ 600m each = 3600m
#   ------------------------------------------------
#   total                            = 6000m (~5.86GB of 7.4GB, ~1.5GB headroom
#                                       for the WSL2 VM/Docker daemon/host OS)
# `-XX:MaxRAMPercentage=70.0` only means something because `mem_limit` sets a
# real cgroup limit for the JVM to detect (same reasoning as ADR-0014's prod
# budget) — without it, a JVM with no cgroup limit still defaults to sizing its
# heap off the full host, which is exactly the bug this fixes.
services:
    # Distributed tracing UI/store (docs/adr/0013) — every service exports spans here
    # over Zipkin's v2 HTTP API. Not in any service's `depends_on`: trace export is
    # fire-and-forget, so a slow/absent Zipkin must never block app startup or requests.
    zipkin:
        image: openzipkin/zipkin-slim:latest
        container_name: zipkin
        mem_limit: 300m
        ports:
            - "9411:9411"

    eureka-server:
        build:
            context: .
            dockerfile: eureka-server/Dockerfile
        container_name: eureka-server
        mem_limit: 600m
        ports:
            - "8761:8761"
        environment:
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            # docs/adr/0016: SerialGC and single-tier JIT are a better fit than the
            # defaults (G1, full tiered compilation) below ~1GB heaps. docs/adr/0017:
            # MaxRAMPercentage only means something because mem_limit above sets a
            # real cgroup limit for the JVM to detect.
            - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70.0
        healthcheck:
            # No curl/wget in the bare eclipse-temurin JRE image — a plain TCP connect
            # via bash's /dev/tcp is enough to gate dependent services' startup order,
            # mirroring the Postgres pg_isready healthcheck below.
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 15s

    project-lab-backend:
        build:
            context: .
            dockerfile: gateway/Dockerfile
        container_name: project-lab-backend
        mem_limit: 900m
        ports:
            - "${SPRING_PORT}:8080"
        volumes:
            - uploads:/app/uploads
        environment:
            - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
            - POSTGRES_HOST=project-lab-database
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_PORT=${POSTGRES_PORT}
            - POSTGRES_DB=${POSTGRES_DB}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            # docs/adr/0016: SerialGC and single-tier JIT are a better fit than the
            # defaults (G1, full tiered compilation) below ~1GB heaps. docs/adr/0017:
            # MaxRAMPercentage only means something because mem_limit above sets a
            # real cgroup limit for the JVM to detect.
            - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70.0
        depends_on:
            project-lab-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    project-lab-database:
        image: postgis/postgis:16-3.4
        container_name: project-lab-database
        mem_limit: 200m
        ports:
            - "${POSTGRES_PORT}:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    review-service:
        build:
            context: .
            dockerfile: review-service/Dockerfile
        container_name: review-service
        mem_limit: 600m
        ports:
            - "8084:8084"
        environment:
            - REVIEW_DB_HOST=review-database
            - REVIEW_DB_PORT=5432
            - REVIEW_DB_NAME=${POSTGRES_DB}
            - REVIEW_DB_USER=${POSTGRES_USER}
            - REVIEW_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            # docs/adr/0016: SerialGC and single-tier JIT are a better fit than the
            # defaults (G1, full tiered compilation) below ~1GB heaps. docs/adr/0017:
            # MaxRAMPercentage only means something because mem_limit above sets a
            # real cgroup limit for the JVM to detect.
            - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70.0
        depends_on:
            review-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    # Own database (docs/adr/0011) — a separate container/volume from
    # project-lab-database, not a schema inside it. Plain postgres (no PostGIS):
    # review has no geo data.
    review-database:
        image: postgres:16-alpine
        container_name: review-database
        mem_limit: 200m
        ports:
            - "5433:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - review_pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    media-service:
        build:
            context: .
            dockerfile: media-service/Dockerfile
        container_name: media-service
        mem_limit: 600m
        ports:
            - "8085:8085"
        # Same named volume project-lab-backend mounts — media-service writes files
        # here, Gateway's existing WebConfig still serves /uploads/** from it
        # unchanged (see media-service's LocalStorageService kdoc, docs/adr/0003).
        volumes:
            - uploads:/app/uploads
        environment:
            - MEDIA_DB_HOST=media-database
            - MEDIA_DB_PORT=5432
            - MEDIA_DB_NAME=${POSTGRES_DB}
            - MEDIA_DB_USER=${POSTGRES_USER}
            - MEDIA_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            # docs/adr/0016: SerialGC and single-tier JIT are a better fit than the
            # defaults (G1, full tiered compilation) below ~1GB heaps. docs/adr/0017:
            # MaxRAMPercentage only means something because mem_limit above sets a
            # real cgroup limit for the JVM to detect.
            - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70.0
        depends_on:
            media-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    # Own database (docs/adr/0011). Plain postgres (no PostGIS): media has no geo data.
    media-database:
        image: postgres:16-alpine
        container_name: media-database
        mem_limit: 200m
        ports:
            - "5434:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - media_pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    identity-service:
        build:
            context: .
            dockerfile: identity-service/Dockerfile
        container_name: identity-service
        mem_limit: 600m
        ports:
            - "8081:8081"
        environment:
            - IDENTITY_DB_HOST=identity-database
            - IDENTITY_DB_PORT=5432
            - IDENTITY_DB_NAME=${POSTGRES_DB}
            - IDENTITY_DB_USER=${POSTGRES_USER}
            - IDENTITY_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            # docs/adr/0016: SerialGC and single-tier JIT are a better fit than the
            # defaults (G1, full tiered compilation) below ~1GB heaps. docs/adr/0017:
            # MaxRAMPercentage only means something because mem_limit above sets a
            # real cgroup limit for the JVM to detect.
            - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70.0
            # No JWT_SECRET here, matching gateway (docker-compose.yml's gateway
            # entry doesn't set it either) — .env doesn't define JWT_SECRET in this
            # lab environment, and Spring's ${JWT_SECRET:default} fallback only
            # kicks in when the env var is genuinely absent, not empty. Setting
            # JWT_SECRET= here would pass an empty string and break that fallback.
        depends_on:
            identity-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    # Own database (docs/adr/0011). Plain postgres (no PostGIS): identity has no geo data.
    identity-database:
        image: postgres:16-alpine
        container_name: identity-database
        mem_limit: 200m
        ports:
            - "5435:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - identity_pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    inventory-service:
        build:
            context: .
            dockerfile: inventory-service/Dockerfile
        container_name: inventory-service
        mem_limit: 600m
        ports:
            - "8082:8082"
        environment:
            - INVENTORY_DB_HOST=inventory-database
            - INVENTORY_DB_PORT=5432
            - INVENTORY_DB_NAME=${POSTGRES_DB}
            - INVENTORY_DB_USER=${POSTGRES_USER}
            - INVENTORY_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            # docs/adr/0016: SerialGC and single-tier JIT are a better fit than the
            # defaults (G1, full tiered compilation) below ~1GB heaps. docs/adr/0017:
            # MaxRAMPercentage only means something because mem_limit above sets a
            # real cgroup limit for the JVM to detect.
            - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70.0
        depends_on:
            inventory-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    # Own database (docs/adr/0011) — postgis/postgis, not plain postgres: Stay.location
    # is a GEOGRAPHY(POINT, 4326) column (mirrors project-lab-database's image choice).
    inventory-database:
        image: postgis/postgis:16-3.4
        container_name: inventory-database
        mem_limit: 200m
        ports:
            - "5436:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - inventory_pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    booking-service:
        build:
            context: .
            dockerfile: booking-service/Dockerfile
        container_name: booking-service
        mem_limit: 600m
        ports:
            - "8083:8083"
        environment:
            - BOOKING_DB_HOST=booking-database
            - BOOKING_DB_PORT=5432
            - BOOKING_DB_NAME=${POSTGRES_DB}
            - BOOKING_DB_USER=${POSTGRES_USER}
            - BOOKING_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            # Test-mode secret key (sk_test_...) for PaymentIntentService/BookingService's
            # real Stripe integration — never the frontend's pk_test_... publishable key.
            - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            # docs/adr/0016: SerialGC and single-tier JIT are a better fit than the
            # defaults (G1, full tiered compilation) below ~1GB heaps. docs/adr/0017:
            # MaxRAMPercentage only means something because mem_limit above sets a
            # real cgroup limit for the JVM to detect.
            - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70.0
        depends_on:
            booking-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    # Own database (docs/adr/0011). Plain postgres (no PostGIS): booking has no geo data.
    booking-database:
        image: postgres:16-alpine
        container_name: booking-database
        mem_limit: 200m
        ports:
            - "5437:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - booking_pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    chatbot-database:
        image: pgvector/pgvector:pg16
        container_name: chatbot-database
        mem_limit: 256m
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres_password
            - POSTGRES_DB=chatbot_db
        volumes:
            - chatbot_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot_db"]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    chatbot-service:
        build:
            context: .
            dockerfile: chatbot-service/Dockerfile
        container_name: chatbot-service
        mem_limit: 800m
        ports:
            - "8086:8086"
        environment:
            - SPRING_DATASOURCE_URL=jdbc:postgresql://chatbot-database:5432/chatbot_db
            - SPRING_DATASOURCE_USERNAME=postgres
            - SPRING_DATASOURCE_PASSWORD=postgres_password
            - SPRING_AI_OPENAI_API_KEY=${SPRING_AI_OPENAI_API_KEY}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70.0
        volumes:
            - ./chatbot-service/FRUI-CONTEXT.md:/app/FRUI-CONTEXT.md
        depends_on:
            chatbot-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

volumes:
    pgdata:
    review_pgdata:
    media_pgdata:
    identity_pgdata:
    inventory_pgdata:
    booking_pgdata:
    uploads:
    chatbot_pgdata:

