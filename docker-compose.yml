services:
    eureka-server:
        build:
            context: .
            dockerfile: eureka-server/Dockerfile
        container_name: eureka-server
        ports:
            - "8761:8761"
        healthcheck:
            # No curl/wget in the bare eclipse-temurin JRE image — a plain TCP connect
            # via bash's /dev/tcp is enough to gate dependent services' startup order,
            # mirroring the Postgres pg_isready healthcheck below.
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 15s

    project-lab-backend:
        build:
            context: .
            dockerfile: gateway/Dockerfile
        container_name: project-lab-backend
        ports:
            - "${SPRING_PORT}:8080"
        volumes:
            - uploads:/app/uploads
        environment:
            - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
            - POSTGRES_HOST=project-lab-database
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_PORT=${POSTGRES_PORT}
            - POSTGRES_DB=${POSTGRES_DB}
            - EUREKA_URL=http://eureka-server:8761/eureka
        depends_on:
            project-lab-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    project-lab-database:
        image: postgis/postgis:16-3.4
        container_name: project-lab-database
        ports:
            - "${POSTGRES_PORT}:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

volumes:
    pgdata:
    uploads:
