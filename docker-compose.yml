services:
    eureka-server:
        build:
            context: .
            dockerfile: eureka-server/Dockerfile
        container_name: eureka-server
        ports:
            - "8761:8761"
        healthcheck:
            # No curl/wget in the bare eclipse-temurin JRE image — a plain TCP connect
            # via bash's /dev/tcp is enough to gate dependent services' startup order,
            # mirroring the Postgres pg_isready healthcheck below.
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 15s

    project-lab-backend:
        build:
            context: .
            dockerfile: gateway/Dockerfile
        container_name: project-lab-backend
        ports:
            - "${SPRING_PORT}:8080"
        volumes:
            - uploads:/app/uploads
        environment:
            - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
            - POSTGRES_HOST=project-lab-database
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_PORT=${POSTGRES_PORT}
            - POSTGRES_DB=${POSTGRES_DB}
            - EUREKA_URL=http://eureka-server:8761/eureka
        depends_on:
            project-lab-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    project-lab-database:
        image: postgis/postgis:16-3.4
        container_name: project-lab-database
        ports:
            - "${POSTGRES_PORT}:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    review-service:
        build:
            context: .
            dockerfile: review-service/Dockerfile
        container_name: review-service
        ports:
            - "8084:8084"
        environment:
            - REVIEW_DB_HOST=review-database
            - REVIEW_DB_PORT=5432
            - REVIEW_DB_NAME=${POSTGRES_DB}
            - REVIEW_DB_USER=${POSTGRES_USER}
            - REVIEW_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
        depends_on:
            review-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    # Own database (docs/adr/0011) — a separate container/volume from
    # project-lab-database, not a schema inside it. Plain postgres (no PostGIS):
    # review has no geo data.
    review-database:
        image: postgres:16
        container_name: review-database
        ports:
            - "5433:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - review_pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    media-service:
        build:
            context: .
            dockerfile: media-service/Dockerfile
        container_name: media-service
        ports:
            - "8085:8085"
        # Same named volume project-lab-backend mounts — media-service writes files
        # here, Gateway's existing WebConfig still serves /uploads/** from it
        # unchanged (see media-service's LocalStorageService kdoc, docs/adr/0003).
        volumes:
            - uploads:/app/uploads
        environment:
            - MEDIA_DB_HOST=media-database
            - MEDIA_DB_PORT=5432
            - MEDIA_DB_NAME=${POSTGRES_DB}
            - MEDIA_DB_USER=${POSTGRES_USER}
            - MEDIA_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
        depends_on:
            media-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    # Own database (docs/adr/0011). Plain postgres (no PostGIS): media has no geo data.
    media-database:
        image: postgres:16
        container_name: media-database
        ports:
            - "5434:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - media_pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    identity-service:
        build:
            context: .
            dockerfile: identity-service/Dockerfile
        container_name: identity-service
        ports:
            - "8081:8081"
        environment:
            - IDENTITY_DB_HOST=identity-database
            - IDENTITY_DB_PORT=5432
            - IDENTITY_DB_NAME=${POSTGRES_DB}
            - IDENTITY_DB_USER=${POSTGRES_USER}
            - IDENTITY_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            # No JWT_SECRET here, matching gateway (docker-compose.yml's gateway
            # entry doesn't set it either) — .env doesn't define JWT_SECRET in this
            # lab environment, and Spring's ${JWT_SECRET:default} fallback only
            # kicks in when the env var is genuinely absent, not empty. Setting
            # JWT_SECRET= here would pass an empty string and break that fallback.
        depends_on:
            identity-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    # Own database (docs/adr/0011). Plain postgres (no PostGIS): identity has no geo data.
    identity-database:
        image: postgres:16
        container_name: identity-database
        ports:
            - "5435:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - identity_pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    inventory-service:
        build:
            context: .
            dockerfile: inventory-service/Dockerfile
        container_name: inventory-service
        ports:
            - "8082:8082"
        environment:
            - INVENTORY_DB_HOST=inventory-database
            - INVENTORY_DB_PORT=5432
            - INVENTORY_DB_NAME=${POSTGRES_DB}
            - INVENTORY_DB_USER=${POSTGRES_USER}
            - INVENTORY_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
        depends_on:
            inventory-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    # Own database (docs/adr/0011) — postgis/postgis, not plain postgres: Stay.location
    # is a GEOGRAPHY(POINT, 4326) column (mirrors project-lab-database's image choice).
    inventory-database:
        image: postgis/postgis:16-3.4
        container_name: inventory-database
        ports:
            - "5436:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - inventory_pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    booking-service:
        build:
            context: .
            dockerfile: booking-service/Dockerfile
        container_name: booking-service
        ports:
            - "8083:8083"
        environment:
            - BOOKING_DB_HOST=booking-database
            - BOOKING_DB_PORT=5432
            - BOOKING_DB_NAME=${POSTGRES_DB}
            - BOOKING_DB_USER=${POSTGRES_USER}
            - BOOKING_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
        depends_on:
            booking-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    # Own database (docs/adr/0011). Plain postgres (no PostGIS): booking has no geo data.
    booking-database:
        image: postgres:16
        container_name: booking-database
        ports:
            - "5437:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - booking_pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

volumes:
    pgdata:
    review_pgdata:
    media_pgdata:
    identity_pgdata:
    inventory_pgdata:
    booking_pgdata:
    uploads:
