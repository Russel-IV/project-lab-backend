            start_period: 10s

    booking-service:
        image: ${ECR_REGISTRY}/project-lab/booking-service:${IMAGE_TAG}
        container_name: booking-service
        mem_limit: 1024m
        restart: "no"
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - BOOKING_DB_HOST=booking-database
            - BOOKING_DB_PORT=5432
            - BOOKING_DB_NAME=${POSTGRES_DB}
            - BOOKING_DB_USER=${POSTGRES_USER}
            - BOOKING_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
        depends_on:
            booking-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    booking-database:
        image: postgres:16-alpine
        container_name: booking-database
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - booking_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 2s
