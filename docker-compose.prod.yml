            retries: 10
            start_period: 10s

    chatbot-database:
        image: pgvector/pgvector:pg16
        container_name: chatbot-database
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=chatbot_db
        volumes:
            - chatbot_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d chatbot_db"]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    chatbot-service:
        image: ${ECR_REGISTRY}/project-lab/chatbot-service:${IMAGE_TAG}
        container_name: chatbot-service
        mem_limit: 1024m
        restart: "no"
        ports:
            - "8086:8086"
        environment:
            - SPRING_DATASOURCE_URL=jdbc:postgresql://chatbot-database:5432/chatbot_db
            - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
            - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
            - SPRING_AI_OPENAI_API_KEY=${SPRING_AI_OPENAI_API_KEY}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70.0
        depends_on:
            chatbot-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

volumes:
    pgdata:
    review_pgdata:
    media_pgdata:
    identity_pgdata:
    inventory_pgdata:
    booking_pgdata:
    uploads:
    chatbot_pgdata:

