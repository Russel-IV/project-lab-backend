    inventory-service:
        image: ${ECR_REGISTRY}/project-lab/inventory-service:${IMAGE_TAG}
        container_name: inventory-service
        mem_limit: 1024m
        restart: "no"
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - INVENTORY_DB_HOST=inventory-database
            - INVENTORY_DB_PORT=5432
            - INVENTORY_DB_NAME=${POSTGRES_DB}
            - INVENTORY_DB_USER=${POSTGRES_USER}
            - INVENTORY_DB_PASSWORD=${POSTGRES_PASSWORD}
