services:
    zipkin:
        image: openzipkin/zipkin-slim:latest
        container_name: zipkin
        mem_limit: 512m
        restart: "no"
        ports:
            - "9411:9411"

    eureka-server:
        image: ${ECR_REGISTRY}/project-lab/eureka-server:${IMAGE_TAG}
        container_name: eureka-server
        mem_limit: 1024m
        restart: "no"
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
        ports:
            - "8761:8761"
        healthcheck:
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 15s

    project-lab-backend:
        image: ${ECR_REGISTRY}/project-lab/gateway:${IMAGE_TAG}
        container_name: project-lab-backend
        mem_limit: 1536m
        restart: "no"
        ports:
            - "8080:8080"
        volumes:
            - uploads:/app/uploads
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - SPRING_PROFILES_ACTIVE=prod
            - POSTGRES_HOST=project-lab-database
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_PORT=5432
            - POSTGRES_DB=${POSTGRES_DB}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            - JWT_SECRET=${JWT_SECRET}
            - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
        depends_on:
            project-lab-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    project-lab-database:
        image: postgis/postgis:16-3.5
        platform: linux/amd64
        container_name: project-lab-database
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    review-service:
        image: ${ECR_REGISTRY}/project-lab/review-service:${IMAGE_TAG}
        container_name: review-service
        mem_limit: 1024m
        restart: "no"
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - REVIEW_DB_HOST=review-database
            - REVIEW_DB_PORT=5432
            - REVIEW_DB_NAME=${POSTGRES_DB}
            - REVIEW_DB_USER=${POSTGRES_USER}
            - REVIEW_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
        depends_on:
            review-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    review-database:
        image: postgres:16-alpine
        container_name: review-database
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - review_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    media-service:
        image: ${ECR_REGISTRY}/project-lab/media-service:${IMAGE_TAG}
        container_name: media-service
        mem_limit: 1024m
        restart: "no"
        ports:
            - "8085:8085"
        volumes:
            - uploads:/app/uploads
        environment:
            - STORAGE_TYPE=${STORAGE_TYPE:-s3}
            - AWS_S3_BUCKET=${AWS_S3_BUCKET:-project-lab-spring-microservices}
            - AWS_REGION=${AWS_REGION:-us-east-2}
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - MEDIA_DB_HOST=media-database
            - MEDIA_DB_PORT=5432
            - MEDIA_DB_NAME=${POSTGRES_DB}
            - MEDIA_DB_USER=${POSTGRES_USER}
            - MEDIA_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
        depends_on:
            media-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    media-database:
        image: postgres:16-alpine
        container_name: media-database
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - media_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    identity-service:
        image: ${ECR_REGISTRY}/project-lab/identity-service:${IMAGE_TAG}
        container_name: identity-service
        mem_limit: 1024m
        restart: "no"
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - IDENTITY_DB_HOST=identity-database
            - IDENTITY_DB_PORT=5432
            - IDENTITY_DB_NAME=${POSTGRES_DB}
            - IDENTITY_DB_USER=${POSTGRES_USER}
            - IDENTITY_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            - JWT_SECRET=${JWT_SECRET}
            - GOOGLE_ACCOUNT_EMAIL=${GOOGLE_ACCOUNT_EMAIL}
            - GOOGLE_APP_PASSWORD=${GOOGLE_APP_PASSWORD}
            - APP_FRONTEND_URL=${APP_FRONTEND_URL}
        depends_on:
            identity-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    identity-database:
        image: postgres:16-alpine
        container_name: identity-database
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - identity_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    inventory-service:
        image: ${ECR_REGISTRY}/project-lab/inventory-service:${IMAGE_TAG}
        container_name: inventory-service
        mem_limit: 1024m
        restart: "no"
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - INVENTORY_DB_HOST=inventory-database
            - INVENTORY_DB_PORT=5432
            - INVENTORY_DB_NAME=${POSTGRES_DB}
            - INVENTORY_DB_USER=${POSTGRES_USER}
            - INVENTORY_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
        depends_on:
            inventory-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    inventory-database:
        image: postgis/postgis:16-3.5
        platform: linux/amd64
        container_name: inventory-database
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - inventory_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    booking-service:
        image: ${ECR_REGISTRY}/project-lab/booking-service:${IMAGE_TAG}
        container_name: booking-service
        mem_limit: 1024m
        restart: "no"
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - BOOKING_DB_HOST=booking-database
            - BOOKING_DB_PORT=5432
            - BOOKING_DB_NAME=${POSTGRES_DB}
            - BOOKING_DB_USER=${POSTGRES_USER}
            - BOOKING_DB_PASSWORD=${POSTGRES_PASSWORD}
            - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
        depends_on:
            booking-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    booking-database:
        image: postgres:16-alpine
        container_name: booking-database
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - booking_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    chatbot-database:
        image: pgvector/pgvector:pg16
        container_name: chatbot-database
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=chatbot_db
        volumes:
            - chatbot_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d chatbot_db"]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    chatbot-service:
        image: ${ECR_REGISTRY}/project-lab/chatbot-service:${IMAGE_TAG}
        container_name: chatbot-service
        mem_limit: 1024m
        restart: "no"
        ports:
            - "8086:8086"
        environment:
            - SPRING_DATASOURCE_URL=jdbc:postgresql://chatbot-database:5432/chatbot_db
            - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
            - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
            - SPRING_AI_OPENAI_API_KEY=${SPRING_AI_OPENAI_API_KEY}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70.0
        depends_on:
            chatbot-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

volumes:
    pgdata:
    review_pgdata:
    media_pgdata:
    identity_pgdata:
    inventory_pgdata:
    booking_pgdata:
    uploads:
    chatbot_pgdata:
