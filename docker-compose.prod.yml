# Production deployment (docs/adr/0014) — Oracle Cloud Ampere A1 Always Free
# instance, 2 OCPUs / 12GB RAM total. See docs/oracle-cloud-deployment.md for
# provisioning and CI/CD wiring.
#
# This is a standalone file, not a docker-compose.yml override: the seven app
# services below reference pre-built `image:` tags pushed to GHCR by
# .github/workflows/deploy.yml, instead of the `build:` blocks docker-compose.yml
# uses for local development — building on this 12GB/2-OCPU box, on top of running
# 14 containers, would be slow and memory-hungry for no benefit (ADR-0014's whole
# premise is that builds are offloaded to CI). Everything else (ports, health
# checks, `depends_on`, database images/volumes, Zipkin) mirrors docker-compose.yml
# exactly, so this file needs updating by hand whenever that one changes — same
# "two hand-synced contracts" discipline this project already uses for Feign
# clients vs. the controllers they call.
#
# Required on the host: a `.env` file (not committed) defining
# ECR_REGISTRY=<aws-account-id>.dkr.ecr.<region>.amazonaws.com,
# IMAGE_TAG (set by the deploy script to the deployed commit SHA), POSTGRES_USER,
# POSTGRES_PASSWORD, POSTGRES_DB, JWT_SECRET, and CORS_ALLOWED_ORIGINS.
#
# Per-container `mem_limit` + `-XX:MaxRAMPercentage` budget (ADR-0014's 12GB total,
# ~2.25GB left as headroom for the host OS/Docker daemon):
#   6x Postgres containers  @ 256m  = 1536m
#   1x Zipkin                @ 512m  =  512m
#   1x Gateway JVM            @ 1536m (heaviest: GraphQL + JPA + Feign + Resilience4j)
#   6x domain-service/Eureka JVMs @ 1024m each = 6144m
#   ------------------------------------------------
#   total                            = 9728m (~9.75GB of 12GB)
# `-XX:MaxRAMPercentage=70.0` only means something because `mem_limit` sets a real
# cgroup memory limit for the JVM to detect — without it, MaxRAMPercentage computes
# against the host's full 12GB for every container, which defeats the whole point
# on a box running 7 JVMs at once (unlike the old single-JVM EC2 box, where the
# host's total memory *was* the right thing to compute a percentage of).
#
# `-XX:+UseSerialGC -XX:TieredStopAtLevel=1` (docs/adr/0016) on every JVM: G1
# (the default collector) is tuned for multi-GB heaps and carries per-region/
# remembered-set bookkeeping that's pure overhead below ~1GB — SerialGC's single
# collection thread costs less CPU and memory on heaps this size, which matters
# when 7 JVMs are contending over only 2 OCPUs. TieredStopAtLevel=1 skips the C2
# JIT tier entirely, trading peak steady-state throughput (irrelevant at this
# app's traffic scale) for faster context startup and less CPU spent compiling
# during the startup burst every one of these services goes through.

services:
    zipkin:
        image: openzipkin/zipkin-slim:latest
        container_name: zipkin
        mem_limit: 512m
        restart: "no"
        ports:
            - "9411:9411"

    eureka-server:
        image: ${ECR_REGISTRY}/project-lab/eureka-server:${IMAGE_TAG}
        container_name: eureka-server
        mem_limit: 1024m
        restart: "no"
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
        ports:
            - "8761:8761"
        healthcheck:
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 15s

    project-lab-backend:
        image: ${ECR_REGISTRY}/project-lab/gateway:${IMAGE_TAG}
        container_name: project-lab-backend
        mem_limit: 1536m
        restart: "no"
        ports:
            - "8080:8080"
        volumes:
            - uploads:/app/uploads
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - SPRING_PROFILES_ACTIVE=prod
            - POSTGRES_HOST=project-lab-database
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_PORT=5432
            - POSTGRES_DB=${POSTGRES_DB}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            - JWT_SECRET=${JWT_SECRET}
            - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
        depends_on:
            project-lab-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    project-lab-database:
        image: postgis/postgis:16-3.5
        container_name: project-lab-database
        platform: linux/amd64
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    review-service:
        image: ${ECR_REGISTRY}/project-lab/review-service:${IMAGE_TAG}
        container_name: review-service
        mem_limit: 1024m
        restart: "no"
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - REVIEW_DB_HOST=review-database
            - REVIEW_DB_PORT=5432
            - REVIEW_DB_NAME=${POSTGRES_DB}
            - REVIEW_DB_USER=${POSTGRES_USER}
            - REVIEW_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
        depends_on:
            review-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    review-database:
        image: postgres:16-alpine
        container_name: review-database
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - review_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    media-service:
        image: ${ECR_REGISTRY}/project-lab/media-service:${IMAGE_TAG}
        container_name: media-service
        mem_limit: 1024m
        restart: "no"
        volumes:
            - uploads:/app/uploads
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - MEDIA_DB_HOST=media-database
            - MEDIA_DB_PORT=5432
            - MEDIA_DB_NAME=${POSTGRES_DB}
            - MEDIA_DB_USER=${POSTGRES_USER}
            - MEDIA_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
        depends_on:
            media-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    media-database:
        image: postgres:16-alpine
        container_name: media-database
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - media_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 2s
            timeout: 10s
            retries: 10
            start_period: 10s

    identity-service:
        image: ${ECR_REGISTRY}/project-lab/identity-service:${IMAGE_TAG}
        container_name: identity-service
        mem_limit: 1024m
        restart: "no"
        environment:
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
            - IDENTITY_DB_HOST=identity-database
            - IDENTITY_DB_PORT=5432
            - IDENTITY_DB_NAME=${POSTGRES_DB}
            - IDENTITY_DB_USER=${POSTGRES_USER}
            - IDENTITY_DB_PASSWORD=${POSTGRES_PASSWORD}
            - EUREKA_URL=http://eureka-server:8761/eureka
            - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
            - JWT_SECRET=${JWT_SECRET}
        depends_on:
            identity-database:
                condition: service_healthy
            eureka-server:
                condition: service_healthy

    identity-database:
        image: postgres:16-alpine
        container_name: identity-database
        mem_limit: 256m
        restart: "no"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
