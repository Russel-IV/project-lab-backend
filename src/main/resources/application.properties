# =========================================================================
# Spring Boot Application Properties
# =========================================================================

spring.application.name=project-lab-backend

# ----------------------------------------------------
# DATABASE CONFIGURATION (PostgreSQL)
# ----------------------------------------------------
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mi_base_datos}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password_local}

# ----------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# ----------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
