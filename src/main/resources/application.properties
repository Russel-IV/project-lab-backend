# =========================================================================
# Spring Boot Application Properties
# =========================================================================

spring.application.name=project-lab-backend

# ----------------------------------------------------
# DATABASE CONFIGURATION (PostgreSQL)
# ----------------------------------------------------
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mi_base_datos}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password_local}

# ----------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# ----------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none

# ----------------------------------------------------
# GRAPHQL CONFIGURATION
# ----------------------------------------------------
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:false}
spring.graphql.schema.locations=classpath:graphql/,classpath:graphql/types/,classpath:graphql/inputs/
spring.graphql.schema.printer.enabled=${SCHEMA_PRINTER_ENABLED:false}

# File uploads
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
