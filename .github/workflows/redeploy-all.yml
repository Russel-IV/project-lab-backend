name: Redeploy & Reset Stack

# Manual workflow to stop/restart services on EC2, pull latest ECR images,
# and optionally wipe persistent database volumes (-v) & seed fresh data.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to pull and deploy'
        required: true
        default: 'latest'
        type: string
      reset_data:
        description: 'Wipe database volumes (-v) and seed fresh data'
        required: true
        default: false
        type: boolean

permissions:
  id-token: write  # Required for AWS OIDC authentication
  contents: read   # Required for actions/checkout

jobs:
  redeploy:
    name: Redeploy Stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy configuration and scripts to EC2 host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,scripts/**"
          target: "~/project-lab-backend"
          strip_components: 0

      - name: SSH Deploy and Restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          RESET_DATA: ${{ github.event.inputs.reset_data }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STORAGE_TYPE: ${{ secrets.STORAGE_TYPE }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.SPRING_AI_OPENAI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG,RESET_DATA,AWS_REGION,STORAGE_TYPE,AWS_S3_BUCKET,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,JWT_SECRET,CORS_ALLOWED_ORIGINS,SPRING_AI_OPENAI_API_KEY
          script: |
            set -e
            cd ~/project-lab-backend

            # Log in to ECR on the host
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            if [ "$RESET_DATA" = "true" ]; then
              echo "== Wiping all running containers and persistent volumes (-v) =="
              docker compose -f docker-compose.prod.yml down -v
            else
              echo "== Stopping running containers (preserving persistent volumes) =="
              docker compose -f docker-compose.prod.yml down
            fi

            echo "== Pulling ECR images with tag: $IMAGE_TAG =="
            docker compose -f docker-compose.prod.yml pull

            # Helper function to get port for each service
            get_port() {
              case "$1" in
                project-lab-backend) echo 8080 ;;
                identity-service) echo 8081 ;;
                inventory-service) echo 8082 ;;
                booking-service) echo 8083 ;;
                review-service) echo 8084 ;;
                media-service) echo 8085 ;;
                chatbot-service) echo 8086 ;;
              esac
            }

            echo "== Starting databases and zipkin =="
            docker compose -f docker-compose.prod.yml up -d project-lab-database review-database media-database identity-database inventory-database booking-database chatbot-database zipkin

            # Wait for all databases to report healthy
            for db in project-lab-database review-database media-database identity-database inventory-database booking-database chatbot-database; do
              echo "Waiting for database $db to report healthy..."
              while true; do
                status=$(docker inspect --format='{{.State.Health.Status}}' "$db" 2>/dev/null || echo "starting")
                if [ "$status" = "healthy" ]; then
                  echo "$db is healthy."
                  break
                fi
                sleep 2
              done
            done

            echo "== Starting eureka-server =="
            docker compose -f docker-compose.prod.yml up -d eureka-server
            echo "Waiting for eureka-server to report healthy..."
            while true; do
              status=$(docker inspect --format='{{.State.Health.Status}}' "eureka-server" 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "eureka-server is healthy."
                break
              fi
              sleep 2
            done

            echo "== Starting app services sequentially to avoid CPU throttling =="
            APP_SERVICES="identity-service inventory-service booking-service review-service media-service chatbot-service project-lab-backend"
            for svc in $APP_SERVICES; do
              echo "Starting service $svc..."
              docker compose -f docker-compose.prod.yml up -d "$svc"
              port=$(get_port "$svc")
              echo "Waiting for $svc health on internal port $port..."
              healthy=false
              for attempt in $(seq 1 30); do
                if docker exec "$svc" wget -q -O - "http://localhost:$port/actuator/health" 2>/dev/null | grep -q "UP"; then
                  echo "$svc is up and healthy!"
                  healthy=true
                  break
                fi
                sleep 3
              done

              if [ "$healthy" = "false" ]; then
                echo "ERROR: $svc failed to report healthy within 90 seconds."
                docker logs "$svc" --tail 50
                exit 1
              fi

              echo "Pausing 5 seconds before starting the next service..."
              sleep 5
            done

            if [ "$RESET_DATA" = "true" ]; then
              echo "== Executing database seeding and population =="
              chmod +x scripts/populate-db.sh scripts/seed-media.sh
              ./scripts/populate-db.sh
            fi

            echo "== Cleaning up old/dangling Docker images =="
            docker system prune -f

            echo "Stack redeploy completed successfully!"
