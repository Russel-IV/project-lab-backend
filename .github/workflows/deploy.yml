name: CI/CD Pipeline to AWS (ECR & EC2)

# Rewritten for AWS ECR and EC2 topology.
# Whenever a microservice is edited, only that microservice is built, pushed to ECR,
# and redeployed on the EC2 host via docker compose.

on:
  push:
    branches: ["main"]
    paths:
      - "**/src/**"
      - "**/pom.xml"
      - "pom.xml"
      - "**/Dockerfile"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write  # Required for AWS OIDC authentication
  contents: read   # Required for actions/checkout

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run Maven Tests (full reactor)
        run: chmod +x mvnw && ./mvnw test

  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.compute.outputs.modules }}
      any: ${{ steps.compute.outputs.any }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter changed paths
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'pom.xml'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - '.github/workflows/deploy.yml'
            eureka-server:
              - 'eureka-server/**'
            gateway:
              - 'gateway/**'
            identity-service:
              - 'identity-service/**'
            inventory-service:
              - 'inventory-service/**'
            booking-service:
              - 'booking-service/**'
            review-service:
              - 'review-service/**'
            media-service:
              - 'media-service/**'
            chatbot-service:
              - 'chatbot-service/**'

      - name: Compute build matrix
        id: compute
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            modules='["eureka-server","gateway","identity-service","inventory-service","booking-service","review-service","media-service","chatbot-service"]'
          else
            modules='${{ steps.filter.outputs.changes }}'
          fi
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          if [ "$modules" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & Push (${{ matrix.module }})
    needs: [test, changes]
    if: needs.test.result == 'success' && needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          # Build context is the repo root, not the module directory
          context: .
          file: ${{ matrix.module }}/Dockerfile
          platforms: linux/arm64  # Target EC2 ARM64 instance
          push: true
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/project-lab/${{ matrix.module }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/project-lab/${{ matrix.module }}:latest



  deploy:
    name: Deploy to AWS EC2
    needs: [test, changes, build-and-push]
    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.changes.outputs.any == 'true' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy docker-compose.prod.yml to the EC2 host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/project-lab-backend"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.changes.outputs.any == 'true' && github.sha || 'latest' }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CHANGED_SERVICES: ${{ needs.changes.outputs.modules }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.SPRING_AI_OPENAI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG,AWS_REGION,CHANGED_SERVICES,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,JWT_SECRET,CORS_ALLOWED_ORIGINS,SPRING_AI_OPENAI_API_KEY
          script: |
            set -e
            cd ~/project-lab-backend

            # Log in to ECR on the host
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Map changed modules to docker-compose service names:
            # - gateway module maps to project-lab-backend service
            # - chatbot-service module maps to chatbot-service service
            # - others map 1-to-1
            services=""
            for module in $(echo "$CHANGED_SERVICES" | jq -r '.[]'); do
              if [ "$module" = "gateway" ]; then
                services="$services project-lab-backend"
              else
                services="$services $module"
              fi
            done

            echo "Target services to update: $services"

            # Pull only the updated images
            docker compose -f docker-compose.prod.yml pull $services

            # Recreate only the updated containers
            docker compose -f docker-compose.prod.yml up -d $services

            # Clean up dangling/old images
            docker system prune -f

            # Verify Gateway health if it was redeployed
            if echo "$services" | grep -q "project-lab-backend"; then
              echo "Waiting for the Gateway to report healthy..."
              for i in $(seq 1 20); do
                if curl -sf http://localhost:8080/actuator/health >/dev/null; then
                  echo "Gateway is up and healthy!"
                  exit 0
                fi
                echo "Still waiting..."
                sleep 3
              done
              echo "Gateway failed to report healthy within 60 seconds."
              docker compose -f docker-compose.prod.yml logs project-lab-backend --tail 100
              exit 1
            fi
