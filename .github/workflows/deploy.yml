name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: project-lab-backend
  EC2_USER: ubuntu
  # Replace with your actual EC2 public DNS or IP (or store in GitHub Secrets)
  EC2_HOST: ${{ secrets.EC2_HOST }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run Maven Tests
        run: chmod +x mvnw && ./mvnw test

  build-and-deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          AWS_REGION: ${{ env.AWS_REGION }}
          POSTGRES_HOST: ${{ secrets.DB_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: mi_base_datos
          POSTGRES_USER: postgres
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_URI,AWS_REGION,POSTGRES_HOST,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_USER
          script: |
            # 1. Login to ECR on EC2
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $IMAGE_URI

            # 2. Stop and remove the old container if it exists
            docker stop spring-backend || true
            docker rm spring-backend || true

            # 3. Pull and run the new container
            docker run -d \
              --name spring-backend \
              -p 8080:8080 \
              -e POSTGRES_HOST="$POSTGRES_HOST" \
              -e POSTGRES_DB="$POSTGRES_DB" \
              -e POSTGRES_USER="$POSTGRES_USER" \
              -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              -e JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=70.0" \
              --restart unless-stopped \
              $IMAGE_URI

            # 4. Clean up dangling/old images to prevent disk from filling up
            docker system prune -af

            # 5. Wait and perform a quick health check
            echo "Waiting for service startup..."
            sleep 15
            curl --fail http://localhost:8080/actuator/health || { echo "Healthcheck failed!"; exit 1; }
